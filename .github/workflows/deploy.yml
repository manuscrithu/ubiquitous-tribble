name: Deploy

on:
  push:
    branches: [develop]

jobs:
  # ---------------------------------------------------------------------
  # 1. Lint & test — fails fast, before we spend time building images
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------
  # 2. Build & push images to GHCR — only runs if tests passed
  # ---------------------------------------------------------------------
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # lets this job push to GHCR using the built-in token

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # no manual PAT needed

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://app.myslug.jo3.org/api
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

  # ---------------------------------------------------------------------
  # 3. Deploy — SSH into the VM, pull the new images, restart, verify,
  #    and automatically roll back to the last known-good deployment
  #    (images + config) if the post-deploy health check fails.
  # ---------------------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Back up current config on VM before overwriting
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_DEPLOY_KEY }}
          script: |
            set -e
            mkdir -p ~/app/.rollback
            cd ~/app
            if [ -f docker-compose.prod.yml ]; then
              cp docker-compose.prod.yml .rollback/docker-compose.prod.yml
            fi
            if [ -d infra/monitoring ]; then
              rm -rf .rollback/monitoring
              cp -r infra/monitoring .rollback/monitoring
            fi

      - name: Sync compose file and monitoring config to VM
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_DEPLOY_KEY }}
          source: "docker-compose.prod.yml,infra/monitoring"
          target: "app"
          strip_components: 0

      - name: Deploy to Oracle Cloud VM (with automatic rollback on failure)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_DEPLOY_KEY }}
          envs: GITHUB_SHA
          script: |
            set -e
            cd ~/app

            wait_for_health() {
              retries="$1"
              i=1
              while [ "$i" -le "$retries" ]; do
                if curl -sf http://localhost:8000/health > /dev/null; then
                  echo "Backend healthy after ${i} attempt(s)"
                  return 0
                fi
                echo "Waiting for backend... (${i}/${retries})"
                sleep 5
                i=$((i + 1))
              done
              return 1
            }

            export IMAGE_TAG="$GITHUB_SHA"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            set +e
            wait_for_health 40
            HEALTH_OK=$?
            set -e

            if [ "$HEALTH_OK" -eq 0 ]; then
              echo "$GITHUB_SHA" > .last_good_sha
              rm -rf .rollback
              exit 0
            fi

            echo "Deploy failed health check — attempting automatic rollback"

            if [ ! -f .last_good_sha ]; then
              echo "No previous known-good deployment recorded — cannot roll back automatically. Manual intervention required."
              exit 1
            fi

            LAST_GOOD_SHA=$(cat .last_good_sha)
            echo "Rolling back to last known-good SHA: ${LAST_GOOD_SHA}"

            if [ -f .rollback/docker-compose.prod.yml ]; then
              cp .rollback/docker-compose.prod.yml docker-compose.prod.yml
            fi
            if [ -d .rollback/monitoring ]; then
              rm -rf infra/monitoring
              cp -r .rollback/monitoring infra/monitoring
            fi

            export IMAGE_TAG="$LAST_GOOD_SHA"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            set +e
            wait_for_health 20
            ROLLBACK_OK=$?
            set -e

            if [ "$ROLLBACK_OK" -eq 0 ]; then
              echo "Rollback to ${LAST_GOOD_SHA} succeeded — service restored to last known-good version. This deploy is still marked failed."
            else
              echo "Rollback ALSO failed health check — manual intervention required immediately."
            fi
            exit 1